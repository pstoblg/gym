<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Gym</title>
<style>
  /* Only for the loading / error screen. The app's own styles come from app.css. */
  html,body{margin:0;background:#f4f5f7;color:#14171c;font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  @media (prefers-color-scheme: dark){ html,body{background:#0f1115;color:#eef1f5} }
  #boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box}
  #boot .spin{width:28px;height:28px;border:3px solid #7f8896;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #boot button{font:inherit;border:0;border-radius:12px;padding:14px 18px;margin-top:10px;width:100%;max-width:340px;background:#2f6fde;color:#fff;font-weight:600}
  #boot button.sec{background:#7f889633;color:inherit}
  #boot p{max-width:340px;color:#7f8896;font-size:14px}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div></div>
<script>
'use strict';
/* Gym loader.
   Downloads app.js + app.css for the newest commit of the `live` branch from GitHub, keeps them in localStorage,
   and runs them. Works offline with the last downloaded version. Your training data is never touched here. */
(function(){
  const REPO = 'pstoblg/gym', BRANCH = 'live';
  const CODE_KEY = 'gym.code', PREV_KEY = 'gym.code.prev', PIN_KEY = 'gym.code.pin';
  const L = window.GymLoader = { sha:null, loadedAt:0, hasPrevious:false, updateReady:false, justUpdated:false, pinned:false };
  const read = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
  const write = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const timeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);

  async function latestSha(){
    const r = await timeout(fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`, {headers:{Accept:'application/vnd.github.sha'}, cache:'no-store'}), 4000);
    if(!r.ok) throw new Error('GitHub '+r.status);
    const sha = (await r.text()).trim();
    if(!/^[0-9a-f]{40}$/.test(sha)) throw new Error('unexpected answer from GitHub');
    return sha;
  }
  async function download(sha){
    // Files of a fixed commit never change, so there is no stale-cache problem.
    const get = f => timeout(fetch(`https://raw.githubusercontent.com/${REPO}/${sha}/${f}`), 10000).then(r=>{ if(!r.ok) throw new Error(f+' '+r.status); return r.text(); });
    const [css, js] = await Promise.all([get('app.css'), get('app.js')]);
    new Function(js); // syntax check only, does not run the code
    return {sha, css, js, at:Date.now()};
  }
  function store(code){ const cur = read(CODE_KEY); if(cur && cur.sha!==code.sha) write(PREV_KEY, cur); write(CODE_KEY, code); }

  function fail(msg){
    const prev = read(PREV_KEY);
    document.body.innerHTML = `<div id="boot"><h2>Gym could not start</h2><p>${msg}</p><p>Your training data is safe. It is stored separately.</p>
      ${prev? '<button id="bPrev">Use the previous version</button>' : ''}
      <button id="bRetry" class="sec">Download again</button></div>`;
    if(prev) document.getElementById('bPrev').onclick = () => L.rollback();
    document.getElementById('bRetry').onclick = () => { localStorage.removeItem(CODE_KEY); localStorage.removeItem(PIN_KEY); location.reload(); };
  }
  function run(code){
    L.sha = code.sha; L.loadedAt = code.at; L.hasPrevious = !!read(PREV_KEY); L.pinned = !!read(PIN_KEY);
    const st = document.createElement('style'); st.textContent = code.css; document.head.appendChild(st);
    const boot = document.getElementById('boot'); if(boot) boot.remove();
    window.__gymBooted = false;
    const sc = document.createElement('script'); sc.textContent = code.js + '\n//# sourceURL=gym-app.js'; document.body.appendChild(sc);
    if(!window.__gymBooted) fail('This version of the app has an error.');
  }

  let lastCheck = 0, checking = false;
  L.checkNow = async function(manual){
    if(checking || L.pinned || (!manual && Date.now()-lastCheck < 60000)) { if(manual && L.pinned) say('Updates are paused (older version in use).'); return; }
    checking = true; lastCheck = Date.now();
    try{
      const sha = await latestSha();
      const stored = read(CODE_KEY);
      if(sha === L.sha){ if(manual) say('You have the latest version ✓'); return; }
      if(!stored || stored.sha !== sha) store(await download(sha));
      L.updateReady = true;
      if(typeof onUpdateReady === 'function') onUpdateReady();
    }catch(e){ if(manual) say('Update check failed: '+e.message); }
    finally{ checking = false; }
  };
  L.rollback = function(){
    const prev = read(PREV_KEY), cur = read(CODE_KEY); if(!prev) return;
    write(CODE_KEY, prev); if(cur) write(PREV_KEY, cur);
    write(PIN_KEY, prev.sha); // stay on this version until updates are resumed
    location.reload();
  };
  L.unpin = function(){ localStorage.removeItem(PIN_KEY); location.reload(); };
  const say = m => { if(typeof toast === 'function') toast(m); };

  async function boot(){
    // Local development: opened as a file → use app.js / app.css next to this file
    if(location.protocol === 'file:' && !/[?&]remote=1/.test(location.search)){
      delete window.GymLoader;
      const ln = document.createElement('link'); ln.rel='stylesheet'; ln.href='app.css'; document.head.appendChild(ln);
      const sc = document.createElement('script'); sc.src='app.js'; sc.onload = () => { const b=document.getElementById('boot'); if(b) b.remove(); }; document.body.appendChild(sc);
      return;
    }
    const cached = read(CODE_KEY);
    let code = cached;
    if(!read(PIN_KEY)){
      try{
        // Quick check on every start. Offline this fails immediately and the cached version is used.
        const sha = await timeout(latestSha(), cached? 2500 : 8000);
        if(!cached || cached.sha !== sha){
          const fresh = await timeout(download(sha), cached? 5000 : 20000);
          store(fresh); if(cached) L.justUpdated = true; code = fresh;
        }
        lastCheck = Date.now();
      }catch(e){
        if(!cached) return fail('The app needs internet once for the first start. Please connect and try again.<br><small>('+e.message+')</small>');
      }
    }
    run(code);
    // When the app comes back to the foreground (iOS often resumes instead of restarting), look for updates in the background
    document.addEventListener('visibilitychange', () => { if(!document.hidden) L.checkNow(false); });
  }
  boot();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
